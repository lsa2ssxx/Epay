name: BEpusdt tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: epay_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, pdo_mysql
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer test
        env:
          EPAY_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=epay_test;charset=utf8mb4
          EPAY_TEST_DB_USER: root
          EPAY_TEST_DB_PASSWORD: root
